<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在 | 免费IQ智力测试</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      text-align: center;
    }
    .code { font-size: 120px; font-weight: 800; opacity: 0.15; line-height: 1; }
    h1 { font-size: 28px; margin: -20px 0 12px; }
    p { font-size: 16px; opacity: 0.7; margin-bottom: 32px; max-width: 400px; }
    a {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>页面未找到</h1>
  <p>你访问的页面不存在，可能已被移动或删除。</p>
  <a href="/">返回首页</a>
</body>
</html>
